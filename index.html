<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽抽樂 🎲</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 40%, #4a1942 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow-x: hidden;
      position: relative;
    }

    #ageGate {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #0d0518 0%, #1a0a2e 50%, #2d1b4e 100%);
      z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    #ageGate.hidden { display: none; }

    .age-box {
      text-align: center; max-width: 420px; width: 100%;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,105,180,0.3);
      border-radius: 24px; padding: 48px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5); backdrop-filter: blur(12px);
    }
    .age-box h2 {
      font-size: 1.8rem; font-weight: 900; margin-bottom: 12px;
      background: linear-gradient(90deg, #ff69b4, #ff1493);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .age-box p { color: rgba(255,255,255,0.75); font-size: 1.05rem; line-height: 1.6; margin-bottom: 36px; }
    .age-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .age-btn {
      border: none; font-size: 1.15rem; font-weight: 700; padding: 14px 40px;
      border-radius: 50px; cursor: pointer; transition: all 0.25s ease; letter-spacing: 1px;
    }
    .age-btn.yes {
      background: linear-gradient(135deg, #ff1493, #c71585); color: #fff;
      box-shadow: 0 6px 24px rgba(255,20,147,0.45);
    }
    .age-btn.yes:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 10px 32px rgba(255,20,147,0.6); }
    .age-btn.no {
      background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .age-btn.no:hover { background: rgba(255,255,255,0.18); transform: translateY(-2px); }

    .particles {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .particle {
      position: absolute; width: 6px; height: 6px;
      background: rgba(255,105,180,0.6); border-radius: 50%;
      animation: float 12s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; } 90% { opacity: 1; }
      100% { transform: translateY(-20vh) scale(1); opacity: 0; }
    }

    .container {
      position: relative; z-index: 1; text-align: center;
      padding: 20px; max-width: 900px; width: 100%;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 900;
      background: linear-gradient(90deg, #ff69b4, #ff1493, #ff69b4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-shadow: 0 0 30px rgba(255,105,180,0.5);
      margin-bottom: 8px; letter-spacing: 4px;
    }
    .subtitle { font-size: 1.1rem; color: rgba(255,255,255,0.7); margin-bottom: 40px; }

    .btn-group { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    .draw-btn {
      position: relative;
      background: linear-gradient(135deg, #ff1493, #c71585);
      border: none; color: white; font-size: 1.5rem; font-weight: 700;
      padding: 16px 48px; border-radius: 60px; cursor: pointer;
      box-shadow: 0 8px 30px rgba(255,20,147,0.5), 0 0 0 4px rgba(255,105,180,0.2);
      transition: all 0.3s ease; letter-spacing: 2px; overflow: hidden;
    }
    .draw-btn.video-btn {
      background: linear-gradient(135deg, #9b59b6, #8e44ad);
      box-shadow: 0 8px 30px rgba(155,89,182,0.5), 0 0 0 4px rgba(155,89,182,0.2);
    }
    .draw-btn:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 12px 40px rgba(255,20,147,0.7), 0 0 0 6px rgba(255,105,180,0.3);
    }
    .draw-btn.video-btn:hover {
      box-shadow: 0 12px 40px rgba(155,89,182,0.7), 0 0 0 6px rgba(155,89,182,0.3);
    }
    .draw-btn:active { transform: translateY(0) scale(0.98); }
    .draw-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .draw-btn::after {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(transparent, rgba(255,255,255,0.2), transparent);
      transform: rotate(45deg); transition: all 0.6s; opacity: 0;
    }
    .draw-btn:hover::after { left: 100%; opacity: 1; }

    .result-area {
      margin-top: 50px; min-height: 200px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .loading { display: none; flex-direction: column; align-items: center; gap: 20px; }
    .loading.active { display: flex; }
    .spinner {
      width: 60px; height: 60px;
      border: 5px solid rgba(255,105,180,0.3); border-top-color: #ff1493;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 1.2rem; color: #ff69b4; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    .image-wrapper {
      display: none; position: relative; max-width: 100%;
      animation: reveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .image-wrapper.active { display: block; }
    @keyframes reveal {
      0% { opacity: 0; transform: scale(0.5) rotate(-5deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    .image-wrapper img {
      max-width: 100%; max-height: 70vh; border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 3px rgba(255,105,180,0.4);
      display: block; object-fit: contain;
    }
    .image-caption { margin-top: 16px; font-size: 0.95rem; color: rgba(255,255,255,0.6); }
    .error-msg {
      display: none; color: #ff6b6b;
      background: rgba(255,107,107,0.15); padding: 20px 30px;
      border-radius: 12px; border: 1px solid rgba(255,107,107,0.3); max-width: 400px;
    }
    .error-msg.active { display: block; }

    /* ===== 歷史紀錄 ===== */
    .history-section {
      margin-top: 40px;
      width: 100%;
      max-width: 520px;
      text-align: left;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-header h3 {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.85);
      font-weight: 700;
    }
    .clear-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .clear-btn:hover {
      background: rgba(255,80,80,0.2);
      color: #ff6b6b;
      border-color: rgba(255,80,80,0.4);
    }
    .history-list {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,105,180,0.2);
      border-radius: 16px;
      padding: 8px;
      max-height: 320px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      gap: 10px;
    }
    .history-item:hover {
      background: rgba(255,105,180,0.12);
    }
    .history-code {
      font-weight: 700;
      color: #ff69b4;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }
    .history-time {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      white-space: nowrap;
    }
    .history-empty {
      text-align: center;
      padding: 24px;
      color: rgba(255,255,255,0.35);
      font-size: 0.95rem;
    }

    .footer {
      margin-top: 50px; font-size: 0.85rem;
      color: rgba(255,255,255,0.4); line-height: 1.6;
    }

    @media (max-width: 600px) {
      .draw-btn { font-size: 1.2rem; padding: 14px 32px; }
      .image-wrapper img { max-height: 55vh; }
      .age-box { padding: 36px 24px; }
    }
  </style>
</head>
<body>
  <div id="ageGate">
    <div class="age-box">
      <h2>🔞 年齡確認</h2>
      <p>本網站包含成人內容<br>請問您是否已年滿 18 歲？</p>
      <div class="age-btns">
        <button class="age-btn yes" onclick="confirmAge(true)">是，已滿 18 歲</button>
        <button class="age-btn no" onclick="confirmAge(false)">否</button>
      </div>
    </div>
  </div>

  <div class="particles" id="particles"></div>

  <div class="container">
    <h1>抽抽樂</h1>
    <p class="subtitle">🎲 二次元色情 + AI 擬真色情 混合抽取</p>

    <div class="btn-group">
      <button class="draw-btn" id="drawBtn" onclick="draw()">抽 圖 片</button>
      <button class="draw-btn video-btn" id="videoBtn" onclick="drawVideo()">抽 片 片</button>
    </div>

    <div class="result-area">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">正在抽取中...</div>
      </div>

      <div class="image-wrapper" id="imageWrapper">
        <img id="resultImg" alt="抽到的圖片" />
        <p class="image-caption">點擊圖片可放大 · 再按「抽圖片」可繼續抽</p>
      </div>

      <div class="error-msg" id="errorMsg">抽卡失敗了，請再試一次！</div>
    </div>

    <!-- 片片歷史紀錄 -->
    <div class="history-section">
      <div class="history-header">
        <h3>📋 抽片片歷史（最近 20 筆）</h3>
        <button class="clear-btn" onclick="clearHistory()">清空</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">還沒有紀錄，按「抽片片」開始吧</div>
      </div>
    </div>

    <div class="footer">
      <p>圖片來源：二次元 (moe.jitsu / sex.nyan) + AI 擬真 (Civitai / Pollinations)</p>
      <p>片片：隨機番號跳轉 missav.ai（含 FC2-PPV、200GANA、300MIUM）</p>
      <p>本網站僅供娛樂，圖片版權屬於原作者 / 生成模型</p>
    </div>
  </div>

  <script>
    function confirmAge(isAdult) {
      if (isAdult) {
        sessionStorage.setItem('ageVerified', 'true');
        document.getElementById('ageGate').classList.add('hidden');
      } else {
        window.location.href = 'https://youtu.be/ESKTiYwV7iA?si=Bh5ROdaV0qRuxDBa';
      }
    }
    if (sessionStorage.getItem('ageVerified') === 'true') {
      document.getElementById('ageGate').classList.add('hidden');
    }

    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 12 + 's';
      p.style.animationDuration = (8 + Math.random() * 8) + 's';
      p.style.width = p.style.height = (3 + Math.random() * 6) + 'px';
      particlesContainer.appendChild(p);
    }

    const drawBtn = document.getElementById('drawBtn');
    const loading = document.getElementById('loading');
    const imageWrapper = document.getElementById('imageWrapper');
    const resultImg = document.getElementById('resultImg');
    const errorMsg = document.getElementById('errorMsg');

    const realisticPrompts = [
      'photorealistic completely nude woman, detailed breasts and nipples, realistic skin texture, explicit, highly detailed, 8k',
      'ultra realistic naked female model, full frontal nude, detailed genitals, natural lighting, photorealistic',
      'photorealistic woman fully nude, explicit pose, detailed anatomy, soft lighting, sharp focus, 8k',
      'realistic nude woman on bed, explicit, detailed body, natural skin, cinematic lighting',
      'photorealistic naked girl, complete nudity, detailed breasts, realistic photography style',
      'hyper realistic fully nude female, explicit content, perfect skin, studio lighting, 8k uhd',
      'photorealistic woman undressed, nude, detailed intimate areas, high resolution, realistic',
      'ultra detailed photorealistic nude woman, explicit, natural pose, sharp focus, 8k'
    ];

    const apis = [
      async () => {
        const res = await fetch('https://moe.jitsu.top/img/?sort=r18&type=json&num=1');
        const data = await res.json();
        if (data.pics && data.pics.length > 0) return data.pics[0];
        throw new Error('moe.jitsu failed');
      },
      async () => {
        const res = await fetch('https://sex.nyan.run/api/v2/?r18=true&num=1');
        const data = await res.json();
        if (data.success && data.data && data.data.length > 0) return data.data[0].url;
        throw new Error('sex.nyan failed');
      },
      async () => {
        const sorts = ['Newest', 'Most Reactions'];
        const sort = sorts[Math.floor(Math.random() * sorts.length)];
        const res = await fetch(`https://civitai.com/api/v1/images?limit=40&nsfw=X&sort=${encodeURIComponent(sort)}`);
        const data = await res.json();
        const adult = (data.items || []).filter(i => i.nsfwLevel === 'X' || i.nsfwLevel === 'Mature');
        if (adult.length > 0) return adult[Math.floor(Math.random() * adult.length)].url;
        throw new Error('Civitai no X/Mature');
      },
      async () => {
        const prompt = realisticPrompts[Math.floor(Math.random() * realisticPrompts.length)];
        const seed = Math.floor(Math.random() * 999999);
        return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=768&height=1024&seed=${seed}&nologo=true&model=flux`;
      }
    ];

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    async function draw() {
      drawBtn.disabled = true;
      loading.classList.add('active');
      imageWrapper.classList.remove('active');
      errorMsg.classList.remove('active');

      let imageUrl = null;
      let lastError = null;
      const shuffled = shuffle([...apis]);

      for (const api of shuffled) {
        try {
          imageUrl = await api();
          if (imageUrl) break;
        } catch (e) {
          lastError = e;
          console.warn('API 失敗，嘗試下一個...', e);
        }
      }

      loading.classList.remove('active');

      if (imageUrl) {
        resultImg.onload = () => {
          imageWrapper.classList.add('active');
          drawBtn.disabled = false;
        };
        resultImg.onerror = () => {
          errorMsg.textContent = '圖片載入失敗，請再試一次！';
          errorMsg.classList.add('active');
          drawBtn.disabled = false;
        };
        resultImg.src = imageUrl;
      } else {
        errorMsg.textContent = '所有 API 暫時無法使用，請稍後再試！';
        errorMsg.classList.add('active');
        drawBtn.disabled = false;
        console.error(lastError);
      }
    }

    // ===== 番號前綴 =====
    const prefixes = [
      { code: 'SSIS', min: 1, max: 550, pad: 3 },
      { code: 'STARS', min: 1, max: 900, pad: 3 },
      { code: 'SONE', min: 1, max: 400, pad: 3 },
      { code: 'MIDV', min: 1, max: 800, pad: 3 },
      { code: 'MIDE', min: 1, max: 900, pad: 3 },
      { code: 'PRED', min: 1, max: 600, pad: 3 },
      { code: 'IPZZ', min: 1, max: 400, pad: 3 },
      { code: 'IPX', min: 1, max: 999, pad: 3 },
      { code: 'JUQ', min: 1, max: 700, pad: 3 },
      { code: 'JUL', min: 1, max: 999, pad: 3 },
      { code: 'FSDSS', min: 1, max: 800, pad: 3 },
      { code: 'START', min: 1, max: 200, pad: 3 },
      { code: 'CAWD', min: 1, max: 700, pad: 3 },
      { code: 'DASS', min: 1, max: 400, pad: 3 },
      { code: 'ABF', min: 1, max: 200, pad: 3 },
      { code: 'HMN', min: 1, max: 600, pad: 3 },
      { code: 'WAAA', min: 1, max: 400, pad: 3 },
      { code: 'PPPE', min: 1, max: 300, pad: 3 },
      { code: 'MVSD', min: 1, max: 500, pad: 3 },
      { code: 'DLDSS', min: 1, max: 300, pad: 3 },
      { code: '200GANA', min: 1, max: 3200, pad: 3 },
      { code: '300MIUM', min: 1, max: 1200, pad: 3 },
      { code: 'FC2-PPV', min: 1000000, max: 4600000, pad: 0 }
    ];

    // ===== 歷史紀錄 =====
    const HISTORY_KEY = 'chouVideoHistory';
    const MAX_HISTORY = 20;

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveHistory(list) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, MAX_HISTORY)));
    }

    function addToHistory(code, url) {
      const list = getHistory();
      list.unshift({ code, url, time: Date.now() });
      saveHistory(list);
      renderHistory();
    }

    function clearHistory() {
      if (confirm('確定要清空所有抽片片歷史嗎？')) {
        localStorage.removeItem(HISTORY_KEY);
        renderHistory();
      }
    }

    function timeAgo(ts) {
      const sec = Math.floor((Date.now() - ts) / 1000);
      if (sec < 60) return '剛剛';
      if (sec < 3600) return Math.floor(sec / 60) + ' 分鐘前';
      if (sec < 86400) return Math.floor(sec / 3600) + ' 小時前';
      return Math.floor(sec / 86400) + ' 天前';
    }

    function renderHistory() {
      const list = getHistory();
      const el = document.getElementById('historyList');
      if (list.length === 0) {
        el.innerHTML = '<div class="history-empty">還沒有紀錄，按「抽片片」開始吧</div>';
        return;
      }
      el.innerHTML = list.map(item => `
        <div class="history-item" onclick="window.open('${item.url}', '_blank')">
          <span class="history-code">${item.code}</span>
          <span class="history-time">${timeAgo(item.time)}</span>
        </div>
      `).join('');
    }

    // 初始化顯示歷史
    renderHistory();

    function drawVideo() {
      const pref = prefixes[Math.floor(Math.random() * prefixes.length)];
      const num = Math.floor(Math.random() * (pref.max - pref.min + 1)) + pref.min;

      let code;
      if (pref.code === 'FC2-PPV') {
        code = `fc2-ppv-${num}`;
      } else {
        const padded = String(num).padStart(pref.pad, '0');
        code = `${pref.code}-${padded}`;
      }

      const url = `https://missav.ai/${code.toLowerCase()}`;
      window.open(url, '_blank');
      addToHistory(code, url);
      console.log('抽到片片：', code, '→', url);
    }

    resultImg.addEventListener('click', () => {
      if (resultImg.src) window.open(resultImg.src, '_blank');
    });
    resultImg.style.cursor = 'pointer';
  </script>
</body>
</html>
